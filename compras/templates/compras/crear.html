<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGI - Nueva Compra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f4f7fc; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); color: white; padding: 2rem 1.5rem; display: flex; flex-direction: column; }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 3rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
        .logo i { font-size: 2rem; color: #3b82f6; }
        .logo span { font-size: 1.5rem; font-weight: 700; }
        .nav-menu { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 12px 16px; border-radius: 12px; color: #cbd5e1; text-decoration: none; transition: all 0.3s; }
        .nav-item:hover { background: #334155; color: white; transform: translateX(5px); }
        .nav-item.active { background: #3b82f6; color: white; box-shadow: 0 4px 10px rgba(59,130,246,0.3); }
        .main-content { flex: 1; overflow-y: auto; padding: 2rem; }
        .page-header { margin-bottom: 2rem; }
        .page-header h1 { font-size: 2rem; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        .page-header h1 i { color: #3b82f6; }
        .form-card { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #1e293b; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 10px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #3b82f6; }
        .btn-primary { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-size: 1rem; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: #64748b; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-secondary:hover { background: #475569; }
        .buttons { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem; }
        .btn-logout { background: #ef4444; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; margin-left: 15px; }
        .user-info { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 20px; gap: 10px; }
        .producto-item { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; margin-bottom: 10px; align-items: center; }
        .producto-item select, .producto-item input { padding: 8px; border: 1px solid #e2e8f0; border-radius: 8px; }
        .btn-add { background: #22c55e; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .btn-remove { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .total { text-align: right; font-size: 1.2rem; font-weight: bold; margin-top: 1rem; padding-top: 1rem; border-top: 2px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-cubes"></i><span>SIGI</span></div>
        <nav class="nav-menu">
            <a href="{% url 'inventarios:dashboard' %}" class="nav-item"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="{% url 'compras:listar' %}" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Compras</span></a>
            <a href="{% url 'movimientos:listar' %}" class="nav-item"><i class="fas fa-exchange-alt"></i><span>Movimientos</span></a>
            {% if user.rol == 'admin' %}
            <a href="{% url 'usuarios:listar' %}" class="nav-item"><i class="fas fa-users"></i><span>Usuarios</span></a>
            {% endif %}
            <a href="{% url 'productos:listar' %}" class="nav-item"><i class="fas fa-boxes"></i><span>Productos</span></a>
        </nav>
    </div>

    <div class="main-content">
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <span>{{ user.get_full_name|default:user.username }}</span>
            <a href="{% url 'logout' %}" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Salir</a>
        </div>

        <div class="page-header">
            <h1><i class="fas fa-plus"></i> Nueva Compra</h1>
            <p>Registrar una nueva orden de compra</p>
        </div>

        <div class="form-card">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Proveedor</label>
                    <input type="text" name="proveedor" required placeholder="Nombre del proveedor">
                </div>
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" name="fecha" required value="{% now 'Y-m-d' %}">
                </div>

                <h3>Productos</h3>
                <div id="productos-container">
                    <div class="producto-item">
                        <select name="producto_0" required>
                            <option value="">Seleccionar producto...</option>
                            {% for producto in productos %}
                            <option value="{{ producto.id }}" data-precio="{{ producto.precio_venta }}">{{ producto.nombre }} - ${{ producto.precio_venta }}</option>
                            {% endfor %}
                        </select>
                        <input type="number" name="cantidad_0" placeholder="Cantidad" min="1" required>
                        <input type="number" name="precio_0" placeholder="Precio unitario" step="0.01" required>
                        <button type="button" class="btn-remove" onclick="eliminarProducto(this)">✖</button>
                    </div>
                </div>
                <button type="button" class="btn-add" onclick="agregarProducto()">+ Agregar Producto</button>

                <div class="total">
                    Total: $<span id="total">0.00</span>
                </div>

                <div class="form-group">
                    <label>Observaciones</label>
                    <textarea name="observaciones" rows="3"></textarea>
                </div>

                <div class="buttons">
                    <a href="{% url 'compras:listar' %}" class="btn-secondary">Cancelar</a>
                    <button type="submit" class="btn-primary">Guardar Compra</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let productoIndex = 1;

        function agregarProducto() {
            const container = document.getElementById('productos-container');
            const newItem = document.createElement('div');
            newItem.className = 'producto-item';
            newItem.innerHTML = `
                <select name="producto_${productoIndex}">
                    <option value="">Seleccionar producto...</option>
                    {% for producto in productos %}
                    <option value="{{ producto.id }}" data-precio="{{ producto.precio_venta }}">{{ producto.nombre }} - ${{ producto.precio_venta }}</option>
                    {% endfor %}
                </select>
                <input type="number" name="cantidad_${productoIndex}" placeholder="Cantidad" min="1">
                <input type="number" name="precio_${productoIndex}" placeholder="Precio unitario" step="0.01">
                <button type="button" class="btn-remove" onclick="eliminarProducto(this)">✖</button>
            `;
            container.appendChild(newItem);
            productoIndex++;
        }

        function eliminarProducto(btn) {
            btn.closest('.producto-item').remove();
            calcularTotal();
        }

        function calcularTotal() {
            let total = 0;
            const items = document.querySelectorAll('.producto-item');
            items.forEach(item => {
                const cantidad = item.querySelector('input[type="number"]')?.value;
                const precio = item.querySelectorAll('input[type="number"]')[1]?.value;
                if (cantidad && precio) {
                    total += parseFloat(cantidad) * parseFloat(precio);
                }
            });
            document.getElementById('total').innerText = total.toFixed(2);
        }

        document.addEventListener('change', calcularTotal);
        document.addEventListener('keyup', calcularTotal);
    </script>
</body>
</html>
