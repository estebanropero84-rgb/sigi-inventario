{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-tag"></i> {{ titulo }}</h1>
    <p>{% if categoria %}Modificar los datos de la categoría{% else %}Registrar una nueva categoría{% endif %}</p>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Nombre de la Categoría *</label>
            {{ form.nombre }}
        </div>
        
        <div class="form-group">
            <label>Descripción</label>
            {{ form.descripcion }}
        </div>
        
        <div class="buttons">
            <a href="{% url 'productos:categorias' %}" class="btn-secondary">
                <i class="fas fa-arrow-left"></i> Cancelar
            </a>
            <button type="submit" class="btn-primary">
                <i class="fas fa-save"></i> {% if categoria %}Actualizar{% else %}Guardar{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
