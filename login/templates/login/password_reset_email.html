{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
        <div style="background: #3b82f6; padding: 20px; text-align: center;">
            <h1 style="color: white;">SIGI</h1>
        </div>
        <div style="padding: 20px;">
            <h2>Recuperacion de Contrasena</h2>
            <p>Haz clic en el siguiente enlace para crear una nueva contrasena:</p>
            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">
                Restablecer Contrasena
            </a>
            <p>Si no solicitaste este cambio, ignora este mensaje.</p>
        </div>
    </div>
</body>
</html>
