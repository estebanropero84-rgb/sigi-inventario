<!DOCTYPE html>
<html>
<head>
    <title>Recuperar Contrasena</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }
        .container { background: white; padding: 30px; border-radius: 10px; width: 350px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #3b82f6; color: white; padding: 10px; border: none; border-radius: 5px; width: 100%; cursor: pointer; }
        a { color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Recuperar Contrasena</h2>
        <p>Ingresa tu correo electronico:</p>
        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" placeholder="correo@ejemplo.com" required>
            <button type="submit">Enviar enlace</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            <a href="{% url 'login' %}">Volver al login</a>
        </p>
    </div>
</body>
</html>
