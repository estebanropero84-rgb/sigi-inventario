<!DOCTYPE html>
<html>
<head>
    <title>Nueva Contrasena</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }
        .container { background: white; padding: 30px; border-radius: 10px; width: 350px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #3b82f6; color: white; padding: 10px; border: none; border-radius: 5px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Nueva Contrasena</h2>
        <form method="post">
            {% csrf_token %}
            <input type="password" name="new_password1" placeholder="Nueva contrasena" required>
            <input type="password" name="new_password2" placeholder="Confirmar contrasena" required>
            <button type="submit">Cambiar Contrasena</button>
        </form>
    </div>
</body>
</html>
