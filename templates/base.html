<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGI - {% block title %}Sistema de Inventario{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f4f7fc; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); color: white; padding: 2rem 1.5rem; display: flex; flex-direction: column; }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 3rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
        .logo i { font-size: 2rem; color: #3b82f6; }
        .logo span { font-size: 1.5rem; font-weight: 700; }
        .nav-menu { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 12px 16px; border-radius: 12px; color: #cbd5e1; text-decoration: none; transition: all 0.3s; }
        .nav-item:hover { background: #334155; color: white; transform: translateX(5px); }
        .nav-item.active { background: #3b82f6; color: white; box-shadow: 0 4px 10px rgba(59,130,246,0.3); }
        .main-content { flex: 1; overflow-y: auto; padding: 2rem; }
        .page-header { margin-bottom: 2rem; }
        .page-header h1 { font-size: 2rem; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        .page-header h1 i { color: #3b82f6; }
        .page-header p { color: #64748b; margin-top: 0.5rem; }
        .btn-primary { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-success { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-success:hover { background: #16a34a; }
        .btn-warning { background: #f97316; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.75rem; display: inline-block; }
        .btn-warning:hover { background: #ea580c; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.75rem; display: inline-block; }
        .btn-danger:hover { background: #dc2626; }
        .table-container { background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .section-header h2 { font-size: 1.3rem; color: #1e293b; display: flex; align-items: center; gap: 8px; }
        .form-card { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #1e293b; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 10px; font-family: inherit; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem 0.5rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { color: #64748b; font-weight: 600; }
        .btn-logout { background: #ef4444; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; margin-left: 15px; }
        .user-info { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 20px; gap: 10px; }
        .filters { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
        .filters input, .filters select { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; }
        .search-box { flex: 1; max-width: 300px; }
        .search-box input { width: 100%; }
        .acciones { display: flex; gap: 5px; flex-wrap: wrap; }
        .buttons { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem; }
        .btn-secondary { background: #64748b; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-secondary:hover { background: #475569; }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .alert-success { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
        .alert-error { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-warning { background: #fff3e6; color: #f97316; border: 1px solid #fed7aa; }
        .text-danger { color: #dc2626; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-cubes"></i><span>SIGI</span></div>
        <nav class="nav-menu">
            <!-- Dashboard - Todos pueden ver -->
            <a href="{% url 'inventarios:dashboard' %}" class="nav-item">
                <i class="fas fa-chart-pie"></i><span>Dashboard</span>
            </a>
            
            <!-- Compras - Todos pueden ver -->
            <a href="{% url 'compras:listar' %}" class="nav-item">
                <i class="fas fa-shopping-cart"></i><span>Compras</span>
            </a>
            
            <!-- Movimientos - Todos pueden ver -->
            <a href="{% url 'movimientos:listar' %}" class="nav-item">
                <i class="fas fa-exchange-alt"></i><span>Movimientos</span>
            </a>
            
            <!-- Usuarios - Solo administradores pueden ver -->
            {% if user.rol == 'admin' %}
            <a href="{% url 'usuarios:listar' %}" class="nav-item">
                <i class="fas fa-users"></i><span>Usuarios</span>
            </a>
            {% endif %}
            
            <!-- Productos - Todos pueden ver -->
            <a href="{% url 'productos:listar' %}" class="nav-item">
                <i class="fas fa-boxes"></i><span>Productos</span>
            </a>
        </nav>
    </div>

    <div class="main-content">
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <span>{{ user.get_full_name|default:user.username }}</span>
            <a href="{% url 'logout' %}" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Salir</a>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
