{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-user-edit"></i> Editar Usuario</h1>
    <p>Modificar los datos del usuario</p>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Usuario *</label>
            <input type="text" name="username" value="{{ usuario.username }}" class="form-control" required>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Nombres</label>
                <input type="text" name="first_name" value="{{ usuario.first_name }}" class="form-control">
            </div>
            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" name="last_name" value="{{ usuario.last_name }}" class="form-control">
            </div>
        </div>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ usuario.email }}" class="form-control">
        </div>
        
        <div class="form-group">
            <label>Nueva Contraseña (dejar en blanco para no cambiar)</label>
            <input type="password" name="password" class="form-control" placeholder="Ingrese nueva contraseña solo si desea cambiarla">
        </div>
        
        <div class="form-group">
            <label>Rol</label>
            <select name="rol" class="form-control">
                <option value="almacenista" {% if usuario.rol == 'almacenista' %}selected{% endif %}>Almacenista</option>
                <option value="admin" {% if usuario.rol == 'admin' %}selected{% endif %}>Administrador</option>
                <option value="consultor" {% if usuario.rol == 'consultor' %}selected{% endif %}>Consultor</option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="is_active" {% if usuario.is_active %}checked{% endif %}>
                Usuario activo
            </label>
        </div>
        
        <div class="buttons">
            <a href="{% url 'usuarios:listar' %}" class="btn-secondary">Cancelar</a>
            <button type="submit" class="btn-primary">Guardar Cambios</button>
        </div>
    </form>
</div>

<style>
    .form-card {
        background: white;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        max-width: 600px;
        margin: 0 auto;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }
    .form-control {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
    }
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }
    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }
    .checkbox-label input {
        width: auto;
    }
    .buttons {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
        margin-top: 2rem;
    }
    .btn-primary {
        background: #3b82f6;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
    }
    .btn-secondary {
        background: #64748b;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
    }
</style>
{% endblock %}
